name: endpoint
description: "A new Flutter project."

version: 0.0.3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/slots/
    - assets/images/tiles/
    - assets/sprites/
  fonts:
    - family: Pixeboy
      fonts:
        - asset: fonts/Pixeboy-z8XGD.ttf

